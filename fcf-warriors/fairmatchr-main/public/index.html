<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FCF Warriors Fair Match</title>
  <meta name="description" content="Answer a few questions about your Iowa State Fair personality, get matched with a fair buddy, and say hi." />
  <meta name="theme-color" content="#c8102e" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ========================================================================
       THE APP SHELL
       This is the ONLY page in the app. Everything you see — the sign-up flow,
       your match, the chat, the organizer — is drawn into <main id="view"> by
       app.js and swapped in place, so it feels like a real app (no full page
       reloads, no dead clicks). The top bar and the bottom tabs stay put.
       ===================================================================== -->
  <div id="app">

    <!-- Top bar: brand on the left, who you're signed in as on the right. -->
    <header class="topbar">
      <a class="brand" href="#/" aria-label="FCF Warriors Fair Match home">
        <img class="brand-logo" src="/icon.svg" alt="" />
        <span class="brand-name">FCF Warriors Fair Match</span>
      </a>
      <div id="whoami" class="whoami" hidden></div>
    </header>

    <!-- The screen. app.js renders one view at a time in here. -->
    <main id="view" class="view" aria-live="polite"></main>

    <!-- Bottom tabs: the three main places. Hidden during sign-up. -->
    <nav id="tabbar" class="tabbar" hidden aria-label="Main navigation">
      <button class="tab" data-tab="match" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm0 2c-2.7 0-6 1.34-6 4v2h8v-2c0-.99.47-1.84 1.2-2.5A9.7 9.7 0 0 0 8 13Zm8 0c-.35 0-.74 0-1.15.05A4.4 4.4 0 0 1 16 17v2h6v-2c0-2.66-3.3-4-6-4Z"/></svg>
        <span>Match</span>
      </button>
      <button class="tab" data-tab="chat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2Zm3 6a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 7 9Zm5 0a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 12 9Zm5 0a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 17 9Z"/></svg>
        <span>Chat</span>
      </button>
      <button class="tab" data-tab="organizer" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z"/></svg>
        <span>Organizer</span>
      </button>
    </nav>
  </div>

  <!-- THE QUESTIONS (your survey) load first so the sign-up flow can draw itself. -->
  <script src="/questions.js"></script>
  <!-- The whole app. -->
  <script src="/app.js"></script>
</body>
</html>
